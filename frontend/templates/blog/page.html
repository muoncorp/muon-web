{% extends "site.html" %}

{% block header %}
  {{ site_header::header(current_section="blog") }}
{% endblock %}

{% block content %}
  <article class="container post">
    <header class="post__head">
      <h1>{{ page.title }}</h1>
      {{ site_blog::metadata(page=page) }}
      {{ site_blog::tags(page=page) }}
    </header>

    <div class="prose">
      {{ page.content | safe }}
    </div>

    <script src="https://utteranc.es/client.js"
          repo="muoncorp/muon-web"
          issue-term="pathname"
          label="blog comments"
          theme="preferred-color-scheme"
          crossorigin="anonymous"
          async>
    </script>
  </article>
{% endblock %}
