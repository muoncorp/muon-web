{% extends "blog/section.html" %}

{% block content %}
  <div class="page-head">
    <div class="container">
      <h1>Blog</h1>
    </div>
  </div>

  <div class="container blog">
    {{ site_blog::side_menu(current_category_name=term.name) }}

      <h2>카테고리: {{ term.name }}</h2>
      {{ site_blog::list(pages=term.pages) }}
    </div>
  </div>
{% endblock %}
