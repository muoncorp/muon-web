{% extends "blog/section.html" %}

{% block content %}
  <div class="page-head">
    <div class="container">
      <h1>Blog</h1>
    </div>
  </div>

  <div class="container blog">
    {{ site_blog::side_menu(current_category_name="") }}
    <div>
      <h2>작성자</h2>
      <ul class="term-list">
        {%- for term in terms %}
          <li><a href="{{ term.permalink | safe }}">{{ term.name }} ({{ term.pages | length }})</a></li>
        {%- endfor %}
      </ul>
    </div>
  </div>
{% endblock %}
